name: Daily data refresh

# This is the actual "runs whether or not anyone has the page open" part —
# the piece a static HTML file cannot provide on its own. GitHub Actions
# gives free scheduled runs for public repos (and a generous free tier for
# private ones), which is enough for a job this small and this infrequent.

on:
  schedule:
    # 03:00 UTC = 08:30 IST — after global markets have mostly settled for
    # the day but before Indian business hours, so the "as of" data isn't
    # stale by the time someone in India opens the app that morning.
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Fetch currency history
        run: python sanchay_pipeline/currency_ingest.py
        continue-on-error: true  # one source failing shouldn't block the others

      - name: Fetch sector news
        run: python sanchay_pipeline/news_ingest.py
        continue-on-error: true

      - name: Grow daily learning bank
        run: python sanchay_pipeline/learning_ingest.py
        continue-on-error: true  # runs after news_ingest so it can derive practice notes from today's news

      - name: Fetch mutual fund NAVs (AMFI) and accumulate history
        run: python sanchay_pipeline/amfi_ingest.py
        continue-on-error: true  # will report "insufficient history" for the first ~330 days — expected, not a failure

      - name: Commit updated data
        run: |
          git config user.name "sanchay-data-bot"
          git config user.email "actions@github.com"
          git add sanchay_pipeline/data/*.json
          git diff --staged --quiet || git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
          git push
